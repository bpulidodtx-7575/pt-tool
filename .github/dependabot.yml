version: 2
updates:
  # App dependencies (package.json lives under files/)
  - package-ecosystem: "npm"
    directory: "/files"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch routine dev-tooling bumps into one PR to cut noise.
      dev-dependencies:
        dependency-type: "development"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
