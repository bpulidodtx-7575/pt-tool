name: regen-jsdom-lock
on:
  workflow_dispatch:
  push:
    branches: [fix/vitest-4-for-vite-8]
    paths: ['.github/workflows/regen-jsdom-lock.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vitest-4-for-vite-8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh package-lock.json for jsdom ^26
        working-directory: files
        run: |
          set -euo pipefail
          npm install -g npm@10.9.7
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PY'
          import json
          lock = json.load(open('package-lock.json'))
          pkgs = lock.get('packages', {})
          v = pkgs.get('node_modules/jsdom', {}).get('version', '')
          root = pkgs.get('', {}).get('devDependencies', {}).get('jsdom', '')
          assert v.startswith('26.'), f'expected jsdom 26.x resolved, got {v!r}'
          assert root.startswith('^26'), f'expected jsdom ^26 in root, got {root!r}'
          print('ok jsdom', root, v)
          PY
      - name: Commit lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "bpulidodtx-7575"
          git config user.email "bpulidodtx@gmail.com"
          rm -f .github/workflows/regen-jsdom-lock.yml
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(deps): refresh lockfile for jsdom ^26"
          git push origin HEAD:fix/vitest-4-for-vite-8
