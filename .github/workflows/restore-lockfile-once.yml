name: restore-lockfile-once
on:
  workflow_dispatch:
  push:
    branches: [revert/dependabot-majors-42-47]
    paths: [.github/workflows/restore-lockfile-once.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/dependabot-majors-42-47
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore package-lock.json from 1e0544d
        run: |
          set -euo pipefail
          git checkout 1e0544d9ae29bb9de64820348663444ffdb294be -- files/package-lock.json
          expected=ba3d0c6142fd94a2fab391782d51cb8ec0a0ebd8
          actual=$(git hash-object files/package-lock.json)
          echo "lockfile blob=$actual expected=$expected"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile already restored"
          else
            git commit -m "revert: restore files/package-lock.json from 1e0544d (undo Dependabot majors #42 #43 #44 #47)"
            git push origin HEAD:revert/dependabot-majors-42-47
          fi
          rm -f .github/workflows/restore-lockfile-once.yml
          git add -A .github/workflows/restore-lockfile-once.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot restore-lockfile workflow"
            git push origin HEAD:revert/dependabot-majors-42-47
          fi
