name: CI

on:
  # Run on direct pushes to main, and on every PR. Scoping push to main avoids
  # double runs on PR branches (pull_request already covers those).
  push:
    branches: ["main"]
  pull_request:

defaults:
  run:
    working-directory: files

# No job here pushes commits, comments, or releases — read is the floor.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Real-browser end-to-end tests. Single Node version — installing the browser
  # is heavy, so there's no need to matrix it across 20/22.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: files/playwright-report/
          retention-days: 7

  # Performance/accessibility/best-practices/SEO budgets on the production build.
  # ubuntu-latest ships google-chrome-stable, so no browser download is needed.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: files/.lighthouseci/
          retention-days: 7

  # AI-slop and dead-code gates. Split out from build-and-test so the check name
  # says which gate failed, and so it runs once rather than per Node version.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only to publish the aislop findings to the Security tab (free on public
      # repos). Nothing here writes to the repository itself.
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dead code and unused dependencies
        run: npm run deadcode

      # Written before the gate runs so the findings still reach the Security tab
      # on a failing score, which is exactly when they are worth reading.
      - name: Generate aislop SARIF
        if: ${{ always() }}
        run: npx aislop ci --sarif > aislop.sarif || true

      - name: Upload aislop SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: files/aislop.sarif
          category: aislop

      - name: AI-slop score gate
        run: npm run slop:ci

  # Single required check. Branch protection points at this one job, so adding a
  # job above never means remembering to update a protection rule.
  summary:
    if: ${{ always() }}
    needs: [build-and-test, e2e, lighthouse, security, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($results)"
              exit 1
            fi
          done
          echo "All required jobs succeeded."

  # Dependency vulnerability gate. Only react/react-dom ship to users, so the
  # blocking gate is scoped to production deps; the full tree (build/test
  # tooling) is surfaced non-blockingly for triage.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true
