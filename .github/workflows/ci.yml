name: CI

on:
  # Run on direct pushes to main, and on every PR. Scoping push to main avoids
  # double runs on PR branches (pull_request already covers those).
  push:
    branches: ["main"]
  pull_request:

defaults:
  run:
    working-directory: files

# No job here pushes commits, comments, or releases — read is the floor.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Real-browser end-to-end tests. Single Node version — installing the browser
  # is heavy, so there's no need to matrix it across 20/22.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: files/playwright-report/
          retention-days: 7

  # Performance/accessibility/best-practices/SEO budgets on the production build.
  # ubuntu-latest ships google-chrome-stable, so no browser download is needed.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: files/.lighthouseci/
          retention-days: 7

  # Dependency vulnerability gate. Only react/react-dom ship to users, so the
  # blocking gate is scoped to production deps; the full tree (build/test
  # tooling) is surfaced non-blockingly for triage.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true
