name: CI

on:
  # Run on direct pushes to main, and on every PR. Scoping push to main avoids
  # double runs on PR branches (pull_request already covers those).
  push:
    branches: ["main"]
  pull_request:

defaults:
  run:
    working-directory: files

# No job here pushes commits, comments, or releases — read is the floor.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to ci-workflows' node-build-test.yml so a fix there reaches
  # every consumer without touching this file again. This PR is what proves
  # the extraction is faithful — same steps, same result, on a real runner.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    uses: bpulidodtx-7575/ci-workflows/.github/workflows/node-build-test.yml@main
    with:
      working-directory: files
      cache-dependency-path: files/package-lock.json
      node-version: ${{ matrix.node-version }}

  # Real-browser end-to-end tests. Single Node version — installing the browser
  # is heavy, so there's no need to matrix it across 20/22.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: files/playwright-report/
          retention-days: 7

  # Performance/accessibility/best-practices/SEO budgets on the production build.
  # ubuntu-latest ships google-chrome-stable, so no browser download is needed.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: files/.lighthouseci/
          retention-days: 7

  # AI-slop and dead-code gates. Split out from build-and-test so the check name
  # says which gate failed, and so it runs once rather than per Node version.
  # Same delegation as build-and-test, to ci-workflows' node-deadcode-slop.yml.
  # upload-sarif: true because this repo is public, matching the aislop SARIF
  # upload the inline job used to do.
  quality:
    # The called workflow's job asks for security-events:write (to upload the
    # aislop SARIF), but a caller's workflow-level `permissions: contents:
    # read` above is the ceiling on what a called reusable workflow's jobs can
    # be granted — without this override the write request gets capped to
    # read and the upload step fails.
    permissions:
      contents: read
      security-events: write
    uses: bpulidodtx-7575/ci-workflows/.github/workflows/node-deadcode-slop.yml@main
    with:
      working-directory: files
      cache-dependency-path: files/package-lock.json
      upload-sarif: true

  # Single required check. Branch protection points at this one job, so adding a
  # job above never means remembering to update a protection rule.
  summary:
    if: ${{ always() }}
    needs: [build-and-test, e2e, lighthouse, security, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        # This job never checks out, so the workflow-level
        # `defaults.run.working-directory: files` points at a directory that does
        # not exist here and bash cannot start at all. Override it back to the
        # workspace root.
        working-directory: ${{ github.workspace }}
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($results)"
              exit 1
            fi
          done
          echo "All required jobs succeeded."

  # Dependency vulnerability gate. Only react/react-dom ship to users, so the
  # blocking gate is scoped to production deps; the full tree (build/test
  # tooling) is surfaced non-blockingly for triage.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true
