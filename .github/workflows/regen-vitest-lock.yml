name: regen-vitest-lock
on:
  workflow_dispatch:
  push:
    branches: [fix/vitest-4-for-vite-8]
    paths: ['.github/workflows/regen-vitest-lock.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vitest-4-for-vite-8
          fetch-depth: 0
      - run: git fetch origin main:main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh package-lock.json for vitest 4.1
        working-directory: files
        run: |
          set -euo pipefail
          npm install -g npm@10.9.7
          if ! python3 -c "import json; d=json.load(open('package-lock.json')); assert d.get('packages') and 'node_modules/vite' in d['packages']"; then
            echo "lockfile unusable; restoring from main then refreshing"
            git show origin/main:files/package-lock.json > package-lock.json || git show main:files/package-lock.json > package-lock.json
          fi
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PY'
          import json
          lock = json.load(open('package-lock.json'))
          pkgs = lock.get('packages', {})
          v = pkgs.get('node_modules/vitest', {}).get('version', '')
          root = pkgs.get('', {}).get('devDependencies', {}).get('vitest', '')
          assert v.startswith('4.1'), v
          assert root.startswith('^4.1'), root
          print('ok vitest', root, v)
          PY
      - name: Commit lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "bpulidodtx-7575"
          git config user.email "bpulidodtx@gmail.com"
          rm -f .github/workflows/regen-vitest-lock.yml
          rm -f files/.mcp-size-probe.txt
          rm -rf files/.lockfix-chunks
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(deps): refresh lockfile for vitest 4.1"
          git push origin HEAD:fix/vitest-4-for-vite-8
