name: fix-lockfile
on:
  workflow_dispatch:
  push:
    branches: [revert/dependabot-majors-42-47]
    paths: ['.github/workflows/fix-lockfile.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/dependabot-majors-42-47
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh lockfile with npm 10.9.7
        working-directory: files
        run: |
          set -euo pipefail
          npm install -g npm@10.9.7
          # Restore pre-corruption lock from PR head before bad probe commits if needed,
          # then only refresh lock entries (do not change package.json ranges).
          if ! python3 -c "import json; json.load(open('package-lock.json'))" 2>/dev/null; then
            echo "lockfile corrupt; restoring from 01fec401bc60a3d92faaa1a1c0437cc96194c278"
            git show 01fec401bc60a3d92faaa1a1c0437cc96194c278:files/package-lock.json > package-lock.json
          fi
          npm install --package-lock-only --ignore-scripts
          rm -rf node_modules
          npm ci --ignore-scripts
          python3 - <<'PY'
          import json
          lock=json.load(open('package-lock.json'))
          assert 'node_modules/aislop/node_modules/@types/react' in lock.get('packages', {})
          print('nested @types/react present')
          PY
      - name: Commit lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "bpulidodtx-7575"
          git config user.email "bpulidodtx@gmail.com"
          rm -f .github/workflows/fix-lockfile.yml
          rm -f files/.lockfix-test.txt
          rm -rf files/.lockfix-chunks
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(deps): sync lockfile for aislop nested @types/react"
          git push origin HEAD:revert/dependabot-majors-42-47
